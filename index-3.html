<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>🌍 Хэл сурах</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f6ff;
  --card:#fff;
  --purple:#6c5ce7;
  --orange:#ff6b35;
  --green:#00c896;
  --text:#1a1a2e;
  --muted:#7a7a9a;
  --shadow:0 8px 40px rgba(0,0,0,0.12);
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  color:var(--text);
  background-image:
    radial-gradient(ellipse at 10% 10%, rgba(108,92,231,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 90%, rgba(255,107,53,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(0,200,150,0.07) 0%, transparent 60%);
}

/* ===== SELECTOR SCREEN ===== */
#selector{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem 1.2rem;
  z-index:100;
  transition:opacity .4s, transform .4s;
}
#selector.hidden{
  opacity:0;pointer-events:none;transform:scale(0.96);
}

.sel-logo{
  font-size:3.5rem;margin-bottom:.5rem;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.sel-title{
  font-family:'Fredoka One',cursive;
  font-size:2rem;font-weight:900;
  background:linear-gradient(135deg,#6c5ce7,#ff6b35,#00c896);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:.4rem;text-align:center;
  background-size:200% 200%;
  animation:gradShift 4s ease infinite;
}
@keyframes gradShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.sel-sub{
  font-size:.9rem;color:var(--muted);font-weight:600;
  margin-bottom:2.5rem;text-align:center;
}

.sel-cards{
  display:flex;gap:1.2rem;flex-wrap:wrap;
  justify-content:center;width:100%;max-width:480px;
}

.sel-card{
  flex:1;min-width:180px;max-width:220px;
  background:var(--card);
  border-radius:28px;
  padding:2rem 1.2rem;
  text-align:center;
  cursor:pointer;
  box-shadow:var(--shadow);
  border:3px solid transparent;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.sel-card::before{
  content:'';position:absolute;inset:0;
  opacity:0;transition:opacity .25s;
  border-radius:25px;
}
.sel-card.eng::before{background:linear-gradient(135deg,rgba(255,107,53,.06),rgba(255,77,166,.04))}
.sel-card.ger::before{background:linear-gradient(135deg,rgba(108,92,231,.06),rgba(0,200,150,.04))}
.sel-card:hover{transform:translateY(-8px) scale(1.03);}
.sel-card:hover::before{opacity:1;}
.sel-card.eng:hover{border-color:#ff6b35;box-shadow:0 16px 48px rgba(255,107,53,.22);}
.sel-card.ger:hover{border-color:#6c5ce7;box-shadow:0 16px 48px rgba(108,92,231,.22);}
.sel-card:active{transform:translateY(-2px) scale(0.98);}

.sel-flag{font-size:3.5rem;margin-bottom:.8rem;display:block;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.sel-card:hover .sel-flag{transform:scale(1.15) rotate(-5deg);}

.sel-lang{
  font-family:'Fredoka One',cursive;
  font-size:1.4rem;font-weight:900;
  margin-bottom:.3rem;
}
.sel-card.eng .sel-lang{color:#ff6b35;}
.sel-card.ger .sel-lang{color:#6c5ce7;}

.sel-desc{font-size:.75rem;color:var(--muted);font-weight:700;margin-bottom:1rem;}

.sel-levels{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
.sel-lv{
  padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:800;
}
.sel-card.eng .sel-lv{background:rgba(255,107,53,.1);color:#ff6b35;}
.sel-card.ger .sel-lv{background:rgba(108,92,231,.1);color:#6c5ce7;}

.sel-btn{
  margin-top:1.2rem;width:100%;padding:11px;
  border-radius:16px;border:none;
  font-size:.9rem;font-weight:900;
  cursor:pointer;font-family:'Nunito',sans-serif;
  transition:all .2s;letter-spacing:.3px;
  color:#fff;
}
.sel-card.eng .sel-btn{background:linear-gradient(135deg,#ff6b35,#ff4da6);box-shadow:0 4px 16px rgba(255,107,53,.35);}
.sel-card.ger .sel-btn{background:linear-gradient(135deg,#6c5ce7,#a29bfe);box-shadow:0 4px 16px rgba(108,92,231,.35);}
.sel-btn:hover{transform:translateY(-2px);}

.sel-footer{
  margin-top:2rem;font-size:.72rem;color:var(--muted);
  font-weight:700;text-align:center;letter-spacing:.03em;
}
.sel-footer span{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin:0 4px;vertical-align:middle;
}
.sel-footer .dot-eng{background:#ff6b35;}
.sel-footer .dot-ger{background:#6c5ce7;}

/* ===== APP FRAME ===== */
#app-frame{
  position:fixed;inset:0;
  display:none;
  flex-direction:column;
}
#app-frame.show{display:flex;}

#back-bar{
  height:44px;min-height:44px;
  display:flex;align-items:center;
  padding:0 1rem;gap:10px;
  z-index:999;
  flex-shrink:0;
}
#back-bar.eng-bar{background:linear-gradient(135deg,#ff6b35,#ff4da6);}
#back-bar.ger-bar{background:linear-gradient(135deg,#6c5ce7,#a29bfe);}

#back-btn{
  background:rgba(255,255,255,0.22);
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:10px;padding:5px 12px;
  font-size:.78rem;font-weight:800;
  color:#fff;cursor:pointer;
  font-family:'Nunito',sans-serif;
  display:flex;align-items:center;gap:5px;
  transition:background .15s;
  backdrop-filter:blur(4px);
}
#back-btn:hover{background:rgba(255,255,255,0.32);}

#bar-flag{font-size:1.2rem;}
#bar-title{
  font-family:'Fredoka One',cursive;
  font-size:.95rem;color:#fff;
  font-weight:900;letter-spacing:.3px;
}

#the-iframe{
  flex:1;width:100%;border:none;
  display:block;
}

/* Loading screen */
#loading{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:200;
  transition:opacity .4s;
}
#loading.hidden{opacity:0;pointer-events:none;}
.load-spinner{
  width:52px;height:52px;
  border:4px solid var(--bg);
  border-top:4px solid var(--purple);
  border-right:4px solid var(--orange);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:1rem;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:.85rem;font-weight:700;color:var(--muted);}

/* Floating particles background */
.particle{
  position:fixed;border-radius:50%;pointer-events:none;
  animation:particleFloat linear infinite;
  opacity:0.4;
}
@keyframes particleFloat{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0}
  10%{opacity:0.4}
  90%{opacity:0.4}
  100%{transform:translateY(-10vh) rotate(720deg);opacity:0}
}
</style>
</head>
<body>

<!-- Floating particles -->
<div id="particles"></div>

<!-- SELECTOR -->
<div id="selector">
  <div class="sel-logo">🌍</div>
  <div class="sel-title">Хэл сурах</div>
  <div class="sel-sub">Суралцах хэлээ сонгоно уу</div>

  <div class="sel-cards">
    <!-- ENGLISH -->
    <div class="sel-card eng" onclick="openApp('english')">
      <span class="sel-flag">🇬🇧</span>
      <div class="sel-lang">Англи хэл</div>
      <div class="sel-desc">English · Тоглоомоор сур</div>
      <div class="sel-levels">
        <span class="sel-lv">A1</span>
        <span class="sel-lv">A2</span>
        <span class="sel-lv">B1</span>
        <span class="sel-lv">B2</span>
      </div>
      <button class="sel-btn">Эхлэх →</button>
    </div>

    <!-- GERMAN -->
    <div class="sel-card ger" onclick="openApp('german')">
      <span class="sel-flag">🇩🇪</span>
      <div class="sel-lang">Герман хэл</div>
      <div class="sel-desc">Deutsch · Тоглоомоор сур</div>
      <div class="sel-levels">
        <span class="sel-lv">A1</span>
        <span class="sel-lv">A2</span>
        <span class="sel-lv">B1</span>
        <span class="sel-lv">B2</span>
      </div>
      <button class="sel-btn">Эхлэх →</button>
    </div>
  </div>

  <div class="sel-footer">
    <span class="dot-eng"></span> Англи хэл
    &nbsp;·&nbsp;
    <span class="dot-ger"></span> Герман хэл
  </div>
</div>

<!-- APP FRAME -->
<div id="app-frame">
  <div id="back-bar">
    <button id="back-btn" onclick="goBack()">← Буцах</button>
    <span id="bar-flag"></span>
    <span id="bar-title"></span>
  </div>
  <iframe id="the-iframe" src="" title="App"></iframe>
</div>

<!-- LOADING -->
<div id="loading" class="hidden">
  <div class="load-spinner"></div>
  <div class="load-txt">Ачаалж байна...</div>
</div>

<script>
// ── Floating particles ──
(function(){
  const colors = ['#6c5ce7','#ff6b35','#00c896','#ff4da6','#ffa502','#3742fa'];
  const container = document.getElementById('particles');
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 14 + 6;
    p.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*14+10}s;
      animation-delay:${Math.random()*10}s;
    `;
    container.appendChild(p);
  }
})();

// ── App files mapping ──
// These should be in the same folder as this index.html
const APPS = {
  english: {
    file: 'english.html',
    flag: '🇬🇧',
    title: 'Англи хэл',
    barClass: 'eng-bar'
  },
  german: {
    file: 'german.html',
    flag: '🇩🇪',
    title: 'Герман хэл',
    barClass: 'ger-bar'
  }
};

function openApp(lang) {
  const app = APPS[lang];
  const selector = document.getElementById('selector');
  const frame = document.getElementById('app-frame');
  const loading = document.getElementById('loading');
  const iframe = document.getElementById('the-iframe');
  const backBar = document.getElementById('back-bar');

  // Show loading
  loading.classList.remove('hidden');

  // Update back bar
  backBar.className = 'eng-bar ger-bar'.split(' ').reduce((a,c)=>{
    a.classList && a.classList.remove(c); return a;
  }, backBar) || backBar;
  backBar.className = app.barClass;
  document.getElementById('bar-flag').textContent = app.flag;
  document.getElementById('bar-title').textContent = app.title;

  // Hide selector
  selector.classList.add('hidden');

  // Load iframe
  iframe.src = app.file;
  iframe.onload = () => {
    loading.classList.add('hidden');
    frame.classList.add('show');
  };

  // Fallback timeout
  setTimeout(() => {
    loading.classList.add('hidden');
    frame.classList.add('show');
  }, 3000);

  // Save last choice
  try { localStorage.setItem('last_lang', lang); } catch(e) {}
}

function goBack() {
  const frame = document.getElementById('app-frame');
  const selector = document.getElementById('selector');
  const iframe = document.getElementById('the-iframe');

  frame.classList.remove('show');
  selector.classList.remove('hidden');

  // Clear iframe
  setTimeout(() => { iframe.src = ''; }, 400);
}

// Auto-open last language if remembered
window.addEventListener('DOMContentLoaded', () => {
  try {
    const last = localStorage.getItem('last_lang');
    // Don't auto-open, let user choose each time
  } catch(e) {}
});
</script>
</body>
</html>
